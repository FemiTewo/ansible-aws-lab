---
# LAB 7 - Ansible Vault. Create the encrypted file first (see docs/TUTORIAL.md, Lab 7):
#   cp vars/secrets.example.yml vars/secrets.yml
#   ansible-vault encrypt vars/secrets.yml
# Run: ansible-playbook playbooks/07_vault_secrets.yml --ask-vault-pass
- name: Lab 7 - secrets
  hosts: db
  become: true
  vars_files:
    - ../vars/secrets.yml
  roles:
    - postgres
  tasks:
    - name: Prove the secret is loaded without printing it
      ansible.builtin.debug:
        msg: "Password length is {{ vault_db_password | length }}"
