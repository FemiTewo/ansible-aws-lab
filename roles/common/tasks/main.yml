---
- name: Update apt cache (valid for 1 hour)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  become: true

- name: Create admin user
  ansible.builtin.user:
    name: "{{ common_admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
  become: true

- name: Deploy login banner
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
  become: true
