name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ansible ansible-lint yamllint cfn-lint
      - name: yamllint
        run: yamllint .
      - name: cfn-lint
        run: cfn-lint infra/lab.yaml
      - name: Create a dummy inventory
        run: cp inventory/hosts.ini.example inventory/hosts.ini
      - name: Syntax check
        run: |
          ansible-playbook --syntax-check site.yml
          for f in playbooks/*.yml; do ansible-playbook --syntax-check "$f"; done
      - name: ansible-lint
        run: ansible-lint
