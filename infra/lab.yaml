AWSTemplateFormatVersion: "2010-09-09"
Description: Ansible lab - 1 control node + 2 managed nodes (web, db) on Ubuntu 22.04

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for all three servers
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may SSH to the control node. Use your.ip/32 for better security.
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id

Resources:
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ansible lab
      Tags:
        - { Key: Name, Value: ansible-lab-sg }

  SshFromAdmin:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt LabSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref AllowedSshCidr

  AllFromSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt LabSecurityGroup.GroupId
      IpProtocol: "-1"
      SourceSecurityGroupId: !GetAtt LabSecurityGroup.GroupId

  HttpFromAnywhere:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt LabSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  Control:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds: [!GetAtt LabSecurityGroup.GroupId]
      Tags:
        - { Key: Name, Value: ansible-control }
        - { Key: Role, Value: control }

  Web:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds: [!GetAtt LabSecurityGroup.GroupId]
      Tags:
        - { Key: Name, Value: ansible-web }
        - { Key: Role, Value: web }

  Db:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds: [!GetAtt LabSecurityGroup.GroupId]
      Tags:
        - { Key: Name, Value: ansible-db }
        - { Key: Role, Value: db }

Outputs:
  ControlPublicIp:
    Value: !GetAtt Control.PublicIp
  WebPublicIp:
    Value: !GetAtt Web.PublicIp
  WebPrivateIp:
    Value: !GetAtt Web.PrivateIp
  DbPrivateIp:
    Value: !GetAtt Db.PrivateIp
